version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data:/app/app/data
      - ./backend/app/assets:/app/app/assets
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    # Assuming frontend is a React/Vite app in the frontend folder
    build:
      context: ./frontend
      # You might need to add a Dockerfile in the frontend folder
    ports:
      - "3000:3000"
    depends_on:
      - backend
